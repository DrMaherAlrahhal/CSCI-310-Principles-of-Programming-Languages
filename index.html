
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSCI 310 - Principles of Programming Languages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
    }
    header {
      background: #293b72;
      color: white;
      padding: 48px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 12px; }
    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000012;
    }
    .card h2 { margin-top: 0; }
    .button {
      display: inline-block;
      background: #2563a6;
      color: white;
      padding: 11px 16px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }
    .soon { color: #777; }
    footer {
      text-align: center;
      padding: 30px;
      color: #667;
    }
  </style>
</head>
<body>
  <header>
    <h1>CSCI 310</h1>
    <h2>Principles of Programming Languages</h2>
    <p>Interactive Learning Labs</p>
    <p>Dr. Maher Alrahhal</p>
  </header>

  <main>
    <h2>Weekly Learning Activities</h2>
    <div class="grid" id="weeks"></div>
  </main>

  <footer>
    CSCI 310 | Principles of Programming Languages
  </footer>

  <script>

    const labs = [
      { title: "Week 1", url: null },
      { title: "Week 2", url: null },
      {
        title: "Weeks 3 & 4",
        url: "./Week-3-and-4/index.html"
      },
      { title: "Week 5", url: null },
      { title: "Week 6", url: null },
      { title: "Week 7", url: null },
      { title: "Week 8", url: null },
      { title: "Week 9", url: null },
      { title: "Week 10", url: null },
      { title: "Week 11", url: null },
      { title: "Week 12", url: null },
      { title: "Week 13", url: null },
      { title: "Week 14", url: null },
      { title: "Week 15", url: null }
    ];


    const container = document.getElementById("weeks");

    labs.forEach(lab => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = lab.title;
      card.appendChild(title);

      if (lab.url) {
        const link = document.createElement("a");
        link.className = "button";
        link.href = lab.url;
        link.textContent = "Open Learning Lab";
        card.appendChild(link);
      } else {
        const message = document.createElement("p");
        message.className = "soon";
        message.textContent = "Coming Soon";
        card.appendChild(message);
      }

      container.appendChild(card);
    });
  </script>
</body>
</html>
